name: fizz_live
description: Fizz Live Chat and Stream Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  zego_uikit_prebuilt_call: ^4.15.0
  zego_uikit_prebuilt_live_streaming: ^3.11.0
  local_auth: ^2.2.0
  device_info_plus: ^10.1.0
  google_mobile_ads: ^5.1.0

dependency_overrides:
  audioplayers: 5.2.1
  audioplayers_android: 1.1.1
  audioplayers_platform_interface: 1.1.1

flutter:
  uses-material-design: true
  
