name: Build Fizz Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine LTS
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        cache: true

    - name: Recreate Clean Android Structure
      run: |
        rm -rf android
        flutter create . --project-name fizz_live --platforms=android --org com.fizzlive.app

    - name: Force MinSDK 22 Across All Gradle Files
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
        echo "android.newDsl=false" >> android/gradle.properties
        echo "flutter.minSdkVersion=22" >> android/local.properties

        # Universal replacement for Groovy and Kotlin DSL
        python3 -c "
        import glob
        for fpath in glob.glob('android/**/*.gradle*', recursive=True):
            with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                c = f.read()
            c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 22')
            c = c.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 22')
            c = c.replace('flutter.minSdkVersion', '22')
            c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 22')
            with open(fpath, 'w', encoding='utf-8') as f:
                f.write(c)
        "

        # Exclude duplicate legacy kotlin modules
        TARGET_BUILD_FILE=$(find android/app -name "build.gradle*" | head -n 1)
        cat << 'EOF' >> "$TARGET_BUILD_FILE"

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
        EOF

    - name: Install Packages
      run: flutter pub get

    - name: Compile Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FizzLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
