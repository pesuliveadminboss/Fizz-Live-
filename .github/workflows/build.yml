name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Recreate Clean Android Project & Configure SDK 36
        run: |
          rm -rf android build .dart_tool
          flutter create . --platforms android --org com.pesulive.fizzlive
          flutter pub get

          # 1. SDK 36 Alignment
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdk\s*=\s*flutter.compileSdkVersion/compileSdk = 36/g' "$file" || true
              sed -i 's/targetSdk\s*=\s*flutter.targetSdkVersion/targetSdk = 36/g' "$file" || true
              sed -i 's/compileSdkVersion\s\+flutter.compileSdkVersion/compileSdkVersion 36/g' "$file" || true
              sed -i 's/targetSdkVersion\s\+flutter.targetSdkVersion/targetSdkVersion 36/g' "$file" || true
            fi
          done

          # 2. Subproject global SDK 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 3. Add Live Stream Permissions to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.BLUETOOTH" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST" || true
          fi

      - name: Auto-Scale App Logo with Exact Android Safe-Zone
        run: |
          LOGO_PATH=$(find . -maxdepth 2 -iname "*logo*.png" | head -n 1)
          if [ -n "$LOGO_PATH" ]; then
            echo "Found logo at: $LOGO_PATH. Scaling to 52% inside black canvas for zero crop..."
            sudo apt-get update && sudo apt-get install -y imagemagick

            # Standard icon (Legacy Android)
            convert "$LOGO_PATH" -resize 512x512 -background black -gravity center -extent 512x512 legacy_icon.png

            # Adaptive Foreground: Scaled down strictly to 52% inside transparent canvas (Android will never zoom/cut it)
            convert "$LOGO_PATH" -resize 266x266 -background none -gravity center -extent 512x512 adaptive_fg.png

            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
            done

            for pair in "mipmap-mdpi 48 108" "mipmap-hdpi 72 162" "mipmap-xhdpi 96 216" "mipmap-xxhdpi 144 324" "mipmap-xxxhdpi 192 432"; do
              set -- $pair
              # Legacy
              convert legacy_icon.png -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher.png
              convert legacy_icon.png -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher_round.png
              # Foreground for Adaptive
              convert adaptive_fg.png -resize ${3}x${3} android/app/src/main/res/$1/ic_launcher_foreground.png
            done

            # Create black background drawable for adaptive icons
            mkdir -p android/app/src/main/res/values
            cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          EOF

            # Android 8+ Adaptive XML
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          fi

      - name: Compile Official Dart AOT Release Engine and APK
        run: |
          cd android
          chmod +x ./gradlew
          # 1. Compile official Flutter release binaries (AOT libapp.so + libflutter.so)
          ./gradlew app:compileFlutterBuildRelease --no-daemon -Dorg.gradle.vfs.watch=false

          # 2. Package release APK with native binaries included
          ./gradlew app:assembleRelease --no-daemon -Dorg.gradle.vfs.watch=false -Dorg.gradle.parallel=false
          cd ..

      - name: Locate and Export Release APK
        run: |
          FOUND_APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -name "*release*.apk" | head -n 1)
          fi
          echo "Discovered Release APK at: $FOUND_APK"
          cp "$FOUND_APK" Fizz-Live-Release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fizz Live Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: Fizz-Live-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
