name: Build Fizz Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine LTS
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        cache: true

    - name: Recreate Clean Android Structure
      run: |
        rm -rf android
        flutter create . --project-name fizz_live --platforms=android --org com.fizzlive.app

    - name: Configure Exact Android & Kotlin Plugins
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
        echo "android.newDsl=false" >> android/gradle.properties
        echo "flutter.minSdkVersion=22" >> android/local.properties

        # Universal replacement strictly for minSdkVersion
        find android -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/22/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/minSdk = [0-9]*/minSdk = 22/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/minSdkVersion = [0-9]*/minSdkVersion 22/g' {} +

        # Overwrite settings.gradle with valid AGP 8.3.2 and Kotlin 1.9.24
        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.3.2" apply false
            id "org.jetbrains.kotlin.android" version "1.9.24" apply false
        }

        include ":app"
        EOF

        # Strip duplicate legacy kotlin modules from app gradle
        TARGET_BUILD_FILE=$(find android/app -name "build.gradle*" | head -n 1)
        cat << 'EOF' >> "$TARGET_BUILD_FILE"

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
        EOF

    - name: Install Packages
      run: flutter pub get

    - name: Compile Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FizzLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
