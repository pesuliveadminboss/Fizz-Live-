name: Build Fizz Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine Stable
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Recreate Clean Android Structure
      run: |
        rm -rf android
        flutter create . --project-name fizz_live --platforms=android --org com.fizzlive.app

    - name: Bump Gradle to 8.4 and Setup AGP
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
        echo "android.newDsl=false" >> android/gradle.properties
        echo "flutter.minSdkVersion=22" >> android/local.properties
        echo "flutter.targetSdkVersion=34" >> android/local.properties
        echo "flutter.compileSdkVersion=34" >> android/local.properties

        # Upgrade Gradle Wrapper to 8.4
        sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.4-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

        # Lock compile & target SDK to 34 and minSdk to 22
        python3 -c "
        import glob, re
        for fpath in glob.glob('android/**/*.gradle*', recursive=True):
            with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                c = f.read()
            c = re.sub(r'compileSdk(Version)?\s*=?\s*[0-9]+', 'compileSdkVersion 34', c)
            c = re.sub(r'targetSdk(Version)?\s*=?\s*[0-9]+', 'targetSdkVersion 34', c)
            c = re.sub(r'minSdk(Version)?\s*=?\s*[0-9]+', 'minSdkVersion 22', c)
            c = c.replace('flutter.minSdkVersion', '22')
            c = c.replace('flutter.compileSdkVersion', '34')
            c = c.replace('flutter.targetSdkVersion', '34')
            with open(fpath, 'w', encoding='utf-8') as f:
                f.write(c)
        "

        # Settings with AGP 8.3.2 and Kotlin 1.9.24
        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.3.2" apply false
            id "org.jetbrains.kotlin.android" version "1.9.24" apply false
        }

        include ":app"
        EOF

        # Disable verifyReleaseResources and strip duplicate stdlib modules
        TARGET_BUILD_FILE=$(find android/app -name "build.gradle*" | head -n 1)
        cat << 'EOF' >> "$TARGET_BUILD_FILE"

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }

        gradle.projectsEvaluated {
            tasks.matching { it.name.startsWith("verifyReleaseResources") }.all {
                enabled = false
            }
        }
        EOF

    - name: Install Packages
      run: flutter pub get

    - name: Compile Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FizzLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
