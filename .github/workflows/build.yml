name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Structure & SDK 36
        run: |
          rm -rf android build
          flutter create . --platforms android
          flutter pub get

          # App build gradle files update
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdk\s*=\s*flutter.compileSdkVersion/compileSdk = 36/g' "$file" || true
              sed -i 's/targetSdk\s*=\s*flutter.targetSdkVersion/targetSdk = 36/g' "$file" || true
              sed -i 's/compileSdkVersion\s\+flutter.compileSdkVersion/compileSdkVersion 36/g' "$file" || true
              sed -i 's/targetSdkVersion\s\+flutter.targetSdkVersion/targetSdkVersion 36/g' "$file" || true
            fi
          done

          # Global subproject compileSdk 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Auto-Inject App Logo to Android Icons
        run: |
          if [ -f "logo.png" ]; then
            echo "Found logo.png, generating icons..."
            sudo apt-get update && sudo apt-get install -y imagemagick

            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
            done

            convert logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            convert logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

            # Remove vector xml to force png icon
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Compile Official Signed Release APK Direct
        run: |
          # Build flutter dart assets first so app will never white-screen/crash
          flutter build bundle

          # Compile direct via Gradle
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Locate and Rename Release APK
        run: |
          FOUND_APK=$(find . -type f -name "*release*.apk" | head -n 1)
          echo "Found APK at: $FOUND_APK"
          cp "$FOUND_APK" Fizz-Live-Release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fizz Live Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: Fizz-Live-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
