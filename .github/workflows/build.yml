name: Build Fizz Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine Stable
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Recreate Clean Android Structure
      run: |
        rm -rf android
        flutter create . --project-name fizz_live --platforms=android --org com.fizzlive.app

    - name: Align Gradle, AGP and Kotlin to Flutter Requirement
      run: |
        echo "android.useAndroidX=true" > android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
        echo "flutter.minSdkVersion=22" >> android/local.properties
        echo "flutter.targetSdkVersion=34" >> android/local.properties
        echo "flutter.compileSdkVersion=34" >> android/local.properties

        # Upgrade Gradle Wrapper strictly to Gradle 8.14
        sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.14-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
        sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.14-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

        # Clean old DSL files
        rm -f android/settings.gradle.kts
        rm -f android/app/build.gradle.kts

        # Standard settings.gradle with AGP 8.12.0 and Kotlin 2.2.20
        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.12.0" apply false
            id "org.jetbrains.kotlin.android" version "2.2.20" apply false
        }

        include ":app"
        EOF

        # Standard app/build.gradle
        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                localProperties.load(reader)
            }
        }

        def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
        def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

        android {
            namespace "com.fizzlive.app"
            compileSdk 34

            defaultConfig {
                applicationId "com.fizzlive.app"
                minSdk 22
                targetSdk 34
                versionCode flutterVersionCode.toInteger()
                versionName flutterVersionName
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        flutter {
            source '../..'
        }

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }

        gradle.projectsEvaluated {
            tasks.matching { it.name.startsWith("verifyReleaseResources") }.all {
                enabled = false
            }
        }
        EOF

    - name: Install Packages & Prepare Bundle
      run: |
        flutter pub get
        flutter build bundle

    - name: Compile Release APK Directly via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease -Pandroid-skip-build-dependency-validation -Dorg.gradle.project.android-skip-build-dependency-validation=true --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FizzLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
