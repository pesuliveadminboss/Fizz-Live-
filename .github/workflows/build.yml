name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Recreate Clean Android Project & Configure SDK 36
        run: |
          rm -rf android build .dart_tool
          flutter create . --platforms android
          flutter pub get

          # 1. Update SDKs: compileSdk 36, minSdk 24 & Enable MultiDex
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdk\s*=\s*flutter.compileSdkVersion/compileSdk = 36/g' "$file" || true
              sed -i 's/targetSdk\s*=\s*flutter.targetSdkVersion/targetSdk = 36/g' "$file" || true
              sed -i 's/compileSdkVersion\s\+flutter.compileSdkVersion/compileSdkVersion 36/g' "$file" || true
              sed -i 's/targetSdkVersion\s\+flutter.targetSdkVersion/targetSdkVersion 36/g' "$file" || true
              sed -i 's/minSdkVersion\s\+flutter.minSdkVersion/minSdkVersion 24/g' "$file" || true
              sed -i 's/minSdk\s*=\s*flutter.minSdkVersion/minSdk = 24/g' "$file" || true
              sed -i 's/minSdk\s*=\s*21/minSdk = 24/g' "$file" || true
              sed -i 's/minSdkVersion\s\+21/minSdkVersion 24/g' "$file" || true
            fi
          done

          # Disable R8 / ProGuard shrinking (Prevents ZegoCloud from getting wiped out causing launch crash)
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/buildTypes {/,/}/ s/minifyEnabled\s\+true/minifyEnabled false/g' android/app/build.gradle || true
            sed -i '/buildTypes {/,/}/ s/shrinkResources\s\+true/shrinkResources false/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/g' android/app/build.gradle.kts || true
            sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/g' android/app/build.gradle.kts || true
          fi

          # 2. Global subproject compileSdk 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 3. Add Live Stream Permissions & Zego Keep-Alive to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.BLUETOOTH" />\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST" || true
          fi

      - name: Apply Pure Original Uncropped Logo (81MB Style)
        run: |
          LOGO_PATH=$(find . -maxdepth 2 -iname "*logo*.png" | head -n 1)
          if [ -n "$LOGO_PATH" ]; then
            echo "Applying original logo from: $LOGO_PATH"
            sudo apt-get update && sudo apt-get install -y imagemagick

            # Delete adaptive XML so Android treats it as standard legacy icon
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
            done

            for pair in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
              set -- $pair
              convert "$LOGO_PATH" -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher.png
              convert "$LOGO_PATH" -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher_round.png
            done

            sed -i 's/android:icon="@[^"]*"/android:icon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Compile Full Release with Native Dart AOT
        run: |
          # 1. Compile release assets and Dart snapshot
          flutter build bundle

          # 2. Compile Release via Gradle directly with Flutter Dart AOT
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.vfs.watch=false -Dorg.gradle.parallel=false
          cd ..

      - name: Locate and Package Release APK
        run: |
          FOUND_APK=$(find . -type f -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -name "*.apk" | head -n 1)
          fi
          echo "Found compiled release APK at: $FOUND_APK"
          cp "$FOUND_APK" Fizz-Live-Release.apk
          ls -lh Fizz-Live-Release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fizz Live Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: Fizz-Live-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
