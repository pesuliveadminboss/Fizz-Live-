name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Android Project & SDK 36
        run: |
          # 1. Clean existing build cache completely
          flutter clean
          flutter pub get

          # 2. Update compileSdk & targetSdk to 36
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdk\s*=\s*flutter.compileSdkVersion/compileSdk = 36/g' "$file" || true
              sed -i 's/targetSdk\s*=\s*flutter.targetSdkVersion/targetSdk = 36/g' "$file" || true
              sed -i 's/compileSdkVersion\s\+flutter.compileSdkVersion/compileSdkVersion 36/g' "$file" || true
              sed -i 's/targetSdkVersion\s\+flutter.targetSdkVersion/targetSdkVersion 36/g' "$file" || true
            fi
          done

          # 3. Global subproject compileSdk 36 (Fixes sqflite BAKLAVA & Zego SDK)
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 4. Inject Camera/Mic/LiveStream Permissions into Manifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.BLUETOOTH" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST" || true

      - name: Generate Official App Icons
        run: |
          if [ -f "logo.png" ]; then
            # Run official flutter launcher icon generator
            dart run flutter_launcher_icons || true

            # Set manifest icon attribute to launcher_icon
            sed -i 's/android:icon="@[^"]*"/android:icon="@mipmap\/launcher_icon"/g' android/app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/launcher_icon"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Compile Official Flutter Release APK
        run: |
          # Compile native Dart AOT engine + release APK cleanly without daemon conflicts
          flutter build apk --release --no-tree-shake-icons

      - name: Locate and Package Release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Fizz-Live-Release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fizz Live Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: Fizz-Live-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
