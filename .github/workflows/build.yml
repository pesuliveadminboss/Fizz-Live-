name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project & Configure Engine
        run: |
          rm -rf android build
          flutter create . --platforms android
          flutter pub get

          # 1. Update compileSdk & targetSdk to 36
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdk\s*=\s*flutter.compileSdkVersion/compileSdk = 36/g' "$file" || true
              sed -i 's/targetSdk\s*=\s*flutter.targetSdkVersion/targetSdk = 36/g' "$file" || true
              sed -i 's/compileSdkVersion\s\+flutter.compileSdkVersion/compileSdkVersion 36/g' "$file" || true
              sed -i 's/targetSdkVersion\s\+flutter.targetSdkVersion/targetSdkVersion 36/g' "$file" || true
            fi
          done

          # 2. Global subproject compileSdk 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 3. Add Live Stream Permissions to AndroidManifest.xml (Prevents Crash on Launch)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.BLUETOOTH" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"

      - name: Auto-Inject App Logo to Android Icons
        run: |
          if [ -f "logo.png" ]; then
            echo "Generating high-res adaptive launcher icons..."
            sudo apt-get update && sudo apt-get install -y imagemagick

            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
            done

            for pair in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
              set -- $pair
              convert logo.png -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher.png
              convert logo.png -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher_round.png
              convert logo.png -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher_foreground.png
            done

            # Force Manifest to use our generated icons
            sed -i 's/android:icon="@[^"]*"/android:icon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Compile Official Production APK
        run: |
          # Compile Flutter engine bundle first
          flutter build bundle

          # Build release APK via Gradle without caching conflicts
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.parallel=false
          cd ..

      - name: Locate and Package Release APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*release*.apk" | head -n 1)
          fi
          echo "Discovered Release APK at: $APK_PATH"
          cp "$APK_PATH" Fizz-Live-Release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fizz Live Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: Fizz-Live-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
