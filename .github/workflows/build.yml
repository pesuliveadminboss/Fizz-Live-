name: Build Fizz Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine LTS
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        cache: true

    - name: Recreate Clean Android Structure
      run: |
        rm -rf android
        flutter create . --project-name fizz_live --platforms=android --org com.fizzlive.app

    - name: Patch Android SDK 34 and Kotlin Compatibility
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
        echo "android.newDsl=false" >> android/gradle.properties
        echo "flutter.minSdkVersion=22" >> android/local.properties
        echo "flutter.targetSdkVersion=34" >> android/local.properties
        echo "flutter.compileSdkVersion=34" >> android/local.properties

        # Force stable SDK 34 and minSdk 22
        find android -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/22/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/minSdk = [0-9]*/minSdk = 22/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/targetSdk = [0-9]*/targetSdk = 34/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' {} +
        find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' {} +

        # Exclude legacy duplicate kotlin modules
        cat << 'EOF' >> android/app/build.gradle

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
        EOF

        # Bump Kotlin Gradle Plugin to 1.9.0 to fix metadata mismatch
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/g' android/build.gradle || true

    - name: Install Packages
      run: flutter pub get

    - name: Compile Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FizzLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
