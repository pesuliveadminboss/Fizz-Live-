name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Recreate Clean Android Project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.fizzlive --project-name fizz_live .
          
          # Force Kotlin 2.1.0 in settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle || true

          # Direct replacement for minSdk to 22 (handling both legacy and flutter.minSdkVersion syntax)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 22/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 22/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 22/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 22/g' android/app/build.gradle || true

          # Set compile and target SDK to 34
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || true

          # Inject permissions
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.CAMERA"\/>\n<uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>' android/app/src/main/AndroidManifest.xml

      - name: Install Packages
        run: flutter pub get

      - name: Compile Official Signed Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Distribution
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FizzLive.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1-${{ github.run_number }}
          name: Fizz Live v1.0.1 (Coins & Gifts Update)
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/FizzLive.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
