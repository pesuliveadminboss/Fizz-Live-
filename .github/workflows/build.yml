name: Build and Release Fizz Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Android Project & Ensure Proper MainActivity
        run: |
          rm -rf android build .dart_tool
          flutter create . --platforms android --org com.pesulive.fizzlive
          flutter pub get

          # Configure compileSdk 36 & MultiDex to prevent launch crashes
          for file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$file" ]; then
              sed -i 's/compileSdk\s*=\s*flutter.compileSdkVersion/compileSdk = 36/g' "$file" || true
              sed -i 's/targetSdk\s*=\s*flutter.targetSdkVersion/targetSdk = 36/g' "$file" || true
              sed -i 's/compileSdkVersion\s\+flutter.compileSdkVersion/compileSdkVersion 36/g' "$file" || true
              sed -i 's/targetSdkVersion\s\+flutter.targetSdkVersion/targetSdkVersion 36/g' "$file" || true
              sed -i 's/minSdkVersion\s\+flutter.minSdkVersion/minSdkVersion 21/g' "$file" || true
              sed -i 's/minSdk\s*=\s*flutter.minSdkVersion/minSdk = 21/g' "$file" || true
            fi
          done

          # Global subproject compileSdk 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # Live streaming & network permissions in Manifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.BLUETOOTH" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST" || true
          fi

      - name: Inject Pure Original Logo Icons (Matching 81MB Release Style)
        run: |
          LOGO_PATH=$(find . -maxdepth 2 -iname "*logo*.png" | head -n 1)
          if [ -n "$LOGO_PATH" ]; then
            echo "Directly applying original logo from: $LOGO_PATH"
            sudo apt-get update && sudo apt-get install -y imagemagick

            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
            done

            for pair in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
              set -- $pair
              convert "$LOGO_PATH" -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher.png
              convert "$LOGO_PATH" -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher_round.png
              convert "$LOGO_PATH" -resize ${2}x${2} android/app/src/main/res/$1/ic_launcher_foreground.png
            done

            # Force manifest to read standard PNG icons directly
            sed -i 's/android:icon="@[^"]*"/android:icon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build Full Production Flutter APK
        run: |
          # Use flutter's official compile tool with isolated cache to avoid watching lock
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64

      - name: Locate and Package Release APK
        run: |
          FOUND_APK=$(find build/app/outputs/flutter-apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          fi
          echo "Discovered Official Release APK at: $FOUND_APK"
          cp "$FOUND_APK" Fizz-Live-Release.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fizz Live Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: Fizz-Live-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
