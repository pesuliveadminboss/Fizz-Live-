                    IconButton(
                      icon: const Icon(Icons.videocam, color: Color(0xFFFF2E93)),
                      onPressed: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (context) => LiveStreamView(
                              roomID: 'my_room_${widget.userID}',
