name: Build Fizz Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine LTS
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'
        channel: 'stable'
        cache: true

    - name: Recreate Clean Android Structure
      run: |
        rm -rf android
        flutter create . --project-name fizz_live --platforms=android --org com.fizzlive.app

    - name: Inject MinSDK 22 and Exclude Duplicates
      run: |
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
        echo "android.newDsl=false" >> android/gradle.properties

        # Safely insert minSdkVersion 22 right under defaultConfig
        python3 -c "
        path = 'android/app/build.gradle'
        with open(path, 'r') as f:
            content = f.read()
        content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 22')
        content = content.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 22')
        with open(path, 'w') as f:
            f.write(content)
        "

        # Exclude legacy duplicate kotlin modules
        cat << 'EOF' >> android/app/build.gradle

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
        EOF

    - name: Install Packages
      run: flutter pub get

    - name: Compile Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FizzLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
