name: Build and Release Fizz Live APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Recreate Clean Android Project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.fizzlive --project-name fizz_live .
          
          # Kotlin 2.1.0 dependency lock
          find android -name "settings.gradle*" -exec sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' {} + || true
          find android -name "settings.gradle*" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' {} + || true

          # Set minSdk to 22 across Groovy & KTS
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 22/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 22/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = [0-9]*/minSdk = 22/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 22/g' {} + || true

          # Permissions
          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-sdk tools:overrideLibrary="com.github.rmtmckenzie.native_device_orientation"\/>\n<uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.CAMERA"\/>\n<uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>' android/app/src/main/AndroidManifest.xml

          # Native FLAG_SECURE (Robust MainActivity.kt Generator)
          MAIN_DIR=$(dirname $(find android -name "MainActivity.*" | head -n 1))
          rm -f "$MAIN_DIR"/MainActivity.*
          cat << 'KOTLIN_EOF' > "$MAIN_DIR/MainActivity.kt"
          package com.fizzlive.fizz_live

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
              }
          }
          KOTLIN_EOF

          # Logo Setup
          if [ -f "app_logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp app_logo.png "$dir/ic_launcher.png" || true
            done
          fi

      - name: Write Clean Flutter Code
        run: |
          cat << 'DART_EOF' > lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:zego_uikit_prebuilt_live_streaming/zego_uikit_prebuilt_live_streaming.dart';

          void main() => runApp(const FizzLiveApp());

          class FizzLiveApp extends StatelessWidget {
            const FizzLiveApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Fizz Live',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF09080F),
                  appBarTheme: const AppBarTheme(backgroundColor: Color(0xFF09080F), elevation: 0),
                ),
                home: const AgeVerificationGate(),
              );
            }
          }

          class AgeVerificationGate extends StatelessWidget {
            const AgeVerificationGate({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0D0C13),
                body: SafeArea(
                  child: Center(
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 28),
                      child: Container(
                        padding: const EdgeInsets.all(24),
                        decoration: BoxDecoration(
                          color: const Color(0xFF1B1926),
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(color: const Color(0xFFFF2E93), width: 1.5),
                        ),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Container(
                              padding: const EdgeInsets.all(16),
                              decoration: BoxDecoration(shape: BoxShape.circle, color: const Color(0xFFFF2E93).withOpacity(0.15)),
                              child: const Text('18+', style: TextStyle(color: Color(0xFFFF2E93), fontSize: 32, fontWeight: FontWeight.bold)),
                            ),
                            const SizedBox(height: 18),
                            const Text('Age Verification Required', style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 12),
                            const Text('Fizz Live contains live entertainment strictly for adults.\nYou must be 18+ to enter.', textAlign: TextAlign.center, style: TextStyle(color: Colors.white70, fontSize: 13)),
                            const SizedBox(height: 24),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2E93), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                onPressed: () => Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => const FastLoginScreen())),
                                child: const Text('I Am 18 or Older - Enter', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.white)),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class FastLoginScreen extends StatelessWidget {
            const FastLoginScreen({super.key});
            void _showSecretAdminPrompt(BuildContext context) {
              final pinController = TextEditingController();
              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  backgroundColor: const Color(0xFF1F1D2B),
                  title: const Text('Super Admin Verification', style: TextStyle(color: Colors.white)),
                  content: TextField(
                    controller: pinController,
                    obscureText: true,
                    keyboardType: TextInputType.number,
                    style: const TextStyle(color: Colors.white),
                    decoration: const InputDecoration(labelText: 'Enter Master PIN (7777)', labelStyle: TextStyle(color: Colors.grey)),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2E93)),
                      onPressed: () {
                        Navigator.pop(context);
                        if (pinController.text.trim() == '7777') {
                          Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => const MainDashboard(isSuperAdmin: true)));
                        }
                      },
                      child: const Text('Activate Admin'),
                    ),
                  ],
                ),
              );
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: SafeArea(
                  child: Stack(
                    children: [
                      const Center(child: Icon(Icons.favorite, size: 80, color: Color(0xFFFF2E93))),
                      Align(
                        alignment: Alignment.bottomCenter,
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 24),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              SizedBox(
                                width: double.infinity,
                                height: 50,
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2E93), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25))),
                                  onPressed: () => Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => const MainDashboard(isSuperAdmin: false))),
                                  child: const Text('Fast Login', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                                ),
                              ),
                              const SizedBox(height: 12),
                              GestureDetector(
                                onLongPress: () => _showSecretAdminPrompt(context),
                                child: const Text('Agree to User Agreement and Privacy Policy', style: TextStyle(color: Colors.white38, fontSize: 11)),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class MainDashboard extends StatefulWidget {
            final bool isSuperAdmin;
            const MainDashboard({super.key, this.isSuperAdmin = false});
            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            int _currentIndex = 0;
            final String userID = 'user_${Random().nextInt(9000) + 1000}';
            final String userName = 'User_${Random().nextInt(900) + 100}';
            @override
            Widget build(BuildContext context) {
              final screens = [
                ForYouScreen(userID: userID, userName: userName, isSuperAdmin: widget.isSuperAdmin),
                Center(child: Text(widget.isSuperAdmin ? 'Admin Stream List' : 'Follow List', style: const TextStyle(color: Colors.white))),
                Center(child: Text(widget.isSuperAdmin ? 'Admin Betting Controller' : 'Games Hub', style: const TextStyle(color: Colors.white))),
                const Center(child: Text('Messages & Calls', style: TextStyle(color: Colors.white))),
                MeProfileScreen(isSuperAdmin: widget.isSuperAdmin),
              ];
              return Scaffold(
                body: screens[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (index) => setState(() => _currentIndex = index),
                  backgroundColor: const Color(0xFF0F0E17),
                  selectedItemColor: const Color(0xFFFF2E93),
                  unselectedItemColor: Colors.white38,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.thumb_up_alt_outlined), label: 'For You'),
                    BottomNavigationBarItem(icon: Icon(Icons.group_outlined), label: 'Follow'),
                    BottomNavigationBarItem(icon: Icon(Icons.sports_esports_outlined), label: 'Game'),
                    BottomNavigationBarItem(icon: Icon(Icons.chat_bubble_outline), label: 'Messages'),
                    BottomNavigationBarItem(icon: Icon(Icons.person_outline), label: 'Me'),
                  ],
                ),
              );
            }
          }

          class ForYouScreen extends StatelessWidget {
            final String userID;
            final String userName;
            final bool isSuperAdmin;
            const ForYouScreen({super.key, required this.userID, required this.userName, required this.isSuperAdmin});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Fizz Live Pro', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  actions: [
                    if (isSuperAdmin)
                      Container(
                        margin: const EdgeInsets.only(right: 12),
                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                        decoration: BoxDecoration(color: Colors.red, borderRadius: BorderRadius.circular(8)),
                        child: const Text('SUPER ADMIN', style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Colors.white)),
                      ),
                  ],
                ),
                body: Center(
                  child: ElevatedButton.icon(
                    icon: const Icon(Icons.videocam),
                    style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF2E93), padding: const EdgeInsets.symmetric(horizontal: 28, vertical: 14)),
                    label: Text(isSuperAdmin ? 'Enter Ghost Monitor Stream' : 'Join Live Stream'),
                    onPressed: () {
                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (context) => LiveStreamView(roomID: 'room_101', isHost: false, userID: userID, userName: userName, isSuperAdmin: isSuperAdmin),
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }

          class MeProfileScreen extends StatelessWidget {
            final bool isSuperAdmin;
            const MeProfileScreen({super.key, required this.isSuperAdmin});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Me Profile')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    ListTile(
                      leading: const CircleAvatar(backgroundColor: Colors.pink, child: Icon(Icons.person, color: Colors.white)),
                      title: Text(isSuperAdmin ? 'Super Admin Master' : 'User Account', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      subtitle: Text(isSuperAdmin ? 'Role: Master Controller' : 'Gems: 1,630', style: const TextStyle(color: Colors.white54)),
                    ),
                    const Divider(color: Colors.white24),
                    if (isSuperAdmin) ...[
                      Container(
                        padding: const EdgeInsets.all(14),
                        decoration: BoxDecoration(gradient: const LinearGradient(colors: [Colors.redAccent, Colors.deepPurple]), borderRadius: BorderRadius.circular(12)),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: const [
                            Text('MASTER ADMIN FINANCIALS', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                            SizedBox(height: 6),
                            Text('Instant UPI/IMPS Cashout: Ready', style: TextStyle(color: Colors.greenAccent)),
                            Text('Live Gems Economy: Unlimited', style: TextStyle(color: Colors.amberAccent)),
                          ],
                        ),
                      ),
                    ],
                  ],
                ),
              );
            }
          }

          class LiveStreamView extends StatelessWidget {
            final String roomID;
            final bool isHost;
            final String userID;
            final String userName;
            final bool isSuperAdmin;
            const LiveStreamView({super.key, required this.roomID, required this.isHost, required this.userID, required this.userName, this.isSuperAdmin = false});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(
                  children: [
                    ZegoUIKitPrebuiltLiveStreaming(
                      appID: 1576404113,
                      appSign: 'b76540c4974fa2e1ec73787768beaa2c93839634e3e3b33100be649f82662c11',
                      userID: userID,
                      userName: isSuperAdmin ? 'System Inspector' : userName,
                      liveID: roomID,
                      config: isHost ? ZegoUIKitPrebuiltLiveStreamingConfig.host() : ZegoUIKitPrebuiltLiveStreamingConfig.audience(),
                    ),
                    if (isSuperAdmin)
                      SafeArea(
                        child: Container(
                          margin: const EdgeInsets.all(10),
                          padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                          decoration: BoxDecoration(color: Colors.red, borderRadius: BorderRadius.circular(6)),
                          child: const Text('GHOST MODE ACTIVE', style: TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold)),
                        ),
                      ),
                  ],
                ),
              );
            }
          }
          DART_EOF

      - name: Install Packages
        run: flutter pub get

      - name: Compile Official Signed Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Distribution
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FizzLive.apk

      - name: Publish Direct Public Download Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_id }}-${{ github.run_number }}
          name: Fizz Live (18+ Gate & Anti-Screenshot)
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/FizzLive.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
